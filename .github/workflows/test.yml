name: Dotfiles tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.2
      - run: sh dotfiles.sh test
